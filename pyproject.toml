[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridops"
version = "0.1.0"
description = "Production-style electricity data engineering and MLOps platform"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "requests>=2.32,<3",
    "python-dotenv>=1.0,<2",
    "pydantic-settings>=2.5,<3",
    "tenacity>=9,<10"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
