[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridops"
version = "0.1.0"
description = "Production-style electricity data engineering and MLOps platform"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "requests>=2.32,<3",
    "python-dotenv>=1.0,<2",
    "pydantic-settings>=2.5,<3",
    "tenacity>=9,<10",
    "psycopg[binary]>=3.2,<4",
    "prefect>=3,<4",
    "boto3>=1.40,<2",
    "botocore[crt]>=1.40,<2",
    "dbt-postgres>=1.9,<2",
    "scikit-learn>=1.5,<2",
    "xgboost>=2.1,<4",
    "holidays>=0.60,<1",
    "mlflow>=3.1,<4",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1"

]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
