version: 2

models:
  - name: int_eia_demand_hourly
    description: >
      Complete hourly PJM demand timeline from 2023 through 2025.
      Missing EIA source rows and missing demand values are explicitly flagged.

    columns:
      - name: observed_at
        description: Complete UTC hourly timestamp.
        data_tests:
          - not_null
          - unique

      - name: demand_value
        description: EIA demand value. May remain null when source data is incomplete.

      - name: is_missing_source_row
        description: True when EIA supplied no record for the expected hour.
        data_tests:
          - not_null

      - name: is_missing_demand
        description: True when no demand value is available for the hour.
        data_tests:
          - not_null

  - name: int_weather_regional_hourly
    description: >
      Hourly regional weather aggregates across six representative
      PJM-area locations.

    columns:
      - name: observed_at
        description: UTC hourly timestamp.
        data_tests:
          - not_null
          - unique

      - name: weather_location_count
        description: >
          Number of representative PJM weather locations contributing
          to the hourly aggregate.
        data_tests:
          - not_null

      - name: mean_temperature_2m
        data_tests:
          - not_null

      - name: min_temperature_2m
        data_tests:
          - not_null

      - name: max_temperature_2m
        data_tests:
          - not_null

      - name: mean_relative_humidity_2m
        data_tests:
          - not_null